<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1f1f1f;
      --panel: #262626;
      --field-border: #3a3a3a;
      --text: #f4f4f4;
      --muted: #a7a7a7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid var(--field-border);
      background: var(--panel);
    }

    h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button,
    a {
      padding: 7px 10px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      color: #111;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      text-decoration: none;
      white-space: nowrap;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
    }

    .icon-button svg {
      width: 16px;
      height: 16px;
    }

    .frame-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .empty,
    .status {
      display: grid;
      gap: 12px;
      align-content: center;
      min-height: 100%;
      padding: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
    }

    .status {
      min-height: auto;
      padding: 10px;
      border-bottom: 1px solid var(--field-border);
      background: #2b2b2b;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Sidechat</h1>
    <div class="header-actions">
      <button id="reloadFrame" class="icon-button" type="button" aria-label="Reload Sidechat" title="Reload Sidechat">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 6v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19 13a7 7 0 1 1-2-5l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <a id="openTab" href="https://chatgpt.com/" target="_blank" rel="noreferrer">Open tab</a>
    </div>
  </header>

  <div class="frame-wrap">
    <div id="status" class="status hidden"></div>
    <div id="empty" class="empty">Use a Sidechat preset from the right-click menu.</div>
    <iframe id="chatFrame" class="hidden" title="ChatGPT"></iframe>
  </div>

  <script src="sidechat.js"></script>
</body>
</html>
