<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1f1f1f;
      --panel: #262626;
      --field: #303030;
      --field-border: #3a3a3a;
      --text: #f4f4f4;
      --muted: #a7a7a7;
      --accent: #10a37f;
    }

    * {
      box-sizing: border-box;
    }

    html {
      width: 380px;
    }

    body {
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      padding: 18px;
      background: var(--panel);
      border: 1px solid #343434;
      border-radius: 12px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .field {
      margin: 0 0 14px;
    }

    label {
      display: block;
      margin: 0 0 7px;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--field-border);
      border-radius: 8px;
      background: var(--field);
      color: var(--text);
      font: inherit;
      font-size: 13px;
    }

    textarea {
      min-height: 68px;
      resize: vertical;
    }

    input[type="text"]::placeholder,
    textarea::placeholder {
      color: #777;
    }

    select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    .preset-list {
      display: grid;
      gap: 10px;
      margin: 0 0 12px;
    }

    .preset {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid #383838;
      border-radius: 8px;
      background: #2b2b2b;
    }

    .preset-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .preset-header input {
      min-width: 0;
    }

    button.secondary {
      width: auto;
      padding: 8px 10px;
      background: var(--field);
      border: 1px solid var(--field-border);
      color: var(--text);
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .actions button {
      flex: 1;
    }

    .hint,
    .current {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .current span {
      color: #d6d6d6;
      overflow-wrap: anywhere;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 2px 0 18px;
    }

    .preset-toggle-row {
      margin: 0;
    }

    .toggle-row label {
      margin: 0;
    }

    input[type="checkbox"] {
      appearance: none;
      width: 36px;
      height: 20px;
      margin: 0;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--field);
      border: 1px solid var(--field-border);
      cursor: pointer;
      position: relative;
      transition: background 120ms ease, border-color 120ms ease;
    }

    input[type="checkbox"]::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      transition: transform 120ms ease;
    }

    input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    input[type="checkbox"]:checked::after {
      transform: translateX(16px);
    }

    button {
      width: 100%;
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      color: #111;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <main>
    <h1>RightClickGPT</h1>

    <div class="field">
      <label>Prompt presets</label>
      <div id="presetList" class="preset-list"></div>
      <p class="hint">Include <b>&lt;prompt&gt;</b> where the selected text should go.</p>
      <p class="current">Current: <span id="currentPromptFormat"></span></p>
    </div>

    <div class="field">
      <label for="chatProvider">Chat provider</label>
      <select id="chatProvider">
        <option value="chatgpt">ChatGPT</option>
        <option value="t3">t3.chat (beta)</option>
      </select>
    </div>

    <div class="field">
      <label for="defaultPromptBehavior">Default behavior</label>
      <select id="defaultPromptBehavior">
        <option value="newTab">New tab</option>
        <option value="sidechat">Sidechat</option>
      </select>
    </div>

    <div class="field">
      <label for="chatID">Conversation URL</label>
      <input type="text" id="chatID" placeholder="https://chatgpt.com/c/...">
      <p class="hint">Optional. Leave blank to start a new chat each time.</p>
      <p class="current">Current: <span id="currentChatID"></span></p>
    </div>

    <div class="toggle-row">
      <label for="focusExistingTab" id="focusExistingTabLabel">Use existing ChatGPT tab</label>
      <input type="checkbox" id="focusExistingTab">
    </div>

    <div class="actions">
      <button type="button" id="addPreset" class="secondary">Add preset</button>
      <button type="button" id="save">Save</button>
    </div>
  </main>
  <script src="options.js"></script>
</body>
</html>
